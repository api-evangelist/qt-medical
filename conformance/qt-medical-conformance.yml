note: >-
  QT Medical publishes no machine-readable API contract, so nothing here is derived from a
  spec. Every entry below is read from a page QT Medical itself serves. The regulatory
  clearances are device clearances (medical-device market authorisation), not API or
  information-security certifications, and are recorded as such — a 510(k) says nothing
  about how the QTM Dashboard is secured. No SOC 2, ISO 27001 or HITRUST attestation and no
  trust center was found on any QT Medical host.
