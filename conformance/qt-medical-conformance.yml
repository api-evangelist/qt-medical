- id: hl7v2
  name: HL7 v2 messaging
  declared: false
  evidence: >-
    NOT FOUND. Cardiology device data would normally reach an EMR as HL7 v2 ORU^R01 or as
    HL7 aECG/FHIR Observation, and the regulated-health regime shortlist makes these the
    first standards worth probing. QT Medical advertises "API available for EMR integration"
    on its own PCA 500 page but names no standard, publishes no contract, and describes the
    default EMR path as manual PDF upload ("Completed ECG report available in PDF for EMR").
    Recorded as an honest miss — reward-only, so no penalty is implied.
  source: https://qtmedical.com/en-gb/PCA_500
