aid: qt-medical
name: QT Medical
description: 'QT Medical, Inc. is a Diamond Bar, California medical device company building
  the PCA 500, an FDA-cleared, hospital-quality wireless 12-lead electrocardiogram (ECG)
  recorder for professional and personal use, paired with the patented QHeart prepositioned
  electrode sensor, QT ECG mobile and Windows applications, and a HIPAA- and GDPR-compliant
  cloud (the QTM Dashboard) where recorded ECGs are stored, reviewed and shared. The PCA
  500 carries 510(k) clearances for adult, pediatric and acute-care use and additional
  clearances from CE, Japan PMDA, Australia TGA and Health Canada. QT Medical advertises
  an API for EMR integration and an ADK for telehealth partners embedding ECG capture in
  their own mobile applications, but publishes no developer portal, no API reference and
  no machine-readable contract; both are obtained through its sales team.'
